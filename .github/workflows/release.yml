name: non-production-release

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-character lowercase commit to build
        required: true
        type: string
      tag:
        description: New vX.Y.Z tag (must match package.json and must not exist)
        required: true
        type: string
      publish:
        description: Publish an immutable GitHub prerelease (false only builds and attests)
        required: true
        default: false
        type: boolean

concurrency:
  group: microvm-non-production-release-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  acceptance:
    uses: ./.github/workflows/acceptance.yml
    with:
      source_sha: ${{ inputs.source_sha }}
    permissions:
      contents: read

  build:
    needs: acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      NODE_VERSION: 24.20.0
      PNPM_VERSION: 10.34.5
      GO_VERSION: 1.27.1
    outputs:
      version: ${{ steps.identity.outputs.version }}
      tag: ${{ steps.identity.outputs.tag }}
      source_sha: ${{ steps.identity.outputs.source_sha }}
      artifact_name: ${{ steps.bundle.outputs.artifact_name }}
      sdk_artifact_name: ${{ steps.bundle.outputs.sdk_artifact_name }}
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify commit, tag, and package identity
        id: identity
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "source_sha must be an exact lowercase 40-hex commit" >&2
            exit 2
          }
          actual=$(git rev-parse HEAD)
          [[ "$actual" == "$SOURCE_SHA" ]] || {
            echo "checkout resolved $actual instead of $SOURCE_SHA" >&2
            exit 1
          }
          [[ -z $(git status --porcelain) ]] || {
            echo "release checkout is not clean" >&2
            exit 1
          }
          version=$(node -e 'process.stdout.write(JSON.parse(require("node:fs").readFileSync("package.json", "utf8")).version)')
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo "package.json version is not X.Y.Z" >&2
            exit 1
          }
          [[ "$RELEASE_TAG" == "v$version" ]] || {
            echo "tag $RELEASE_TAG does not match package version $version" >&2
            exit 1
          }
          [[ "${{ needs.acceptance.outputs.source_sha }}" == "$SOURCE_SHA" ]] || {
            echo "hosted acceptance did not qualify the requested commit" >&2
            exit 1
          }
          [[ "${{ needs.acceptance.outputs.evidence_digest }}" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "hosted acceptance did not produce a valid evidence digest" >&2
            exit 1
          }
          printf 'version=%s\ntag=%s\nsource_sha=%s\n' "$version" "$RELEASE_TAG" "$SOURCE_SHA" >>"$GITHUB_OUTPUT"

      - name: Install pnpm 10.34.5
        uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
        with:
          version: 10.34.5

      - name: Use Node.js 24.20.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0

      - name: Use Go 1.27.1
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache-dependency-path: guest/go.sum

      - name: Frozen install and complete package checks
        run: |
          pnpm install --frozen-lockfile
          pnpm check-all
          chmod +x dist/bin/daemon.js dist/bin/client.js

      - name: Guest race tests
        working-directory: guest
        run: CGO_ENABLED=1 go test -race ./...

      - name: Build deterministic release artifacts
        id: bundle
        env:
          VERSION: ${{ steps.identity.outputs.version }}
          SOURCE_SHA: ${{ steps.identity.outputs.source_sha }}
          ACCEPTANCE_DIGEST: ${{ needs.acceptance.outputs.evidence_digest }}
          ACCEPTANCE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          source_date_epoch=$(git show -s --format=%ct "$SOURCE_SHA")
          scripts/build-release-artifact.sh \
            --version "$VERSION" \
            --source-sha "$SOURCE_SHA" \
            --source-date-epoch "$source_date_epoch" \
            --acceptance-run-url "$ACCEPTANCE_RUN_URL" \
            --acceptance-evidence-digest "$ACCEPTANCE_DIGEST" \
            --output-dir release
          artifact_name="microvm-host-linux-x86_64-$VERSION-$SOURCE_SHA.tar.gz"
          sdk_artifact_name="microvm-$VERSION-$SOURCE_SHA.tgz"
          for output in "$artifact_name" \
            "$artifact_name.sha256" "$artifact_name.inventory.txt" \
            "$artifact_name.provenance.json" "$artifact_name.spdx.json" \
            "$sdk_artifact_name" "$sdk_artifact_name.sha256" \
            "$sdk_artifact_name.inventory.txt" "$sdk_artifact_name.provenance.json"; do
            [[ -f "release/$output" ]] || {
              echo "release builder did not emit $output" >&2
              exit 1
            }
          done
          actual=$(find release -maxdepth 1 -type f | wc -l)
          [[ "$actual" -eq 9 ]] || {
            echo "release directory must hold exactly the nine release files; found $actual" >&2
            exit 1
          }
          printf 'artifact_name=%s\nsdk_artifact_name=%s\n' "$artifact_name" "$sdk_artifact_name" >>"$GITHUB_OUTPUT"

      - name: Attest release artifact provenance
        uses: actions/attest-build-provenance@e4d4f7c39adfa4c260fb5c147f0622000aa14b99 # v4.0.0
        with:
          subject-path: |
            release/${{ steps.bundle.outputs.artifact_name }}
            release/${{ steps.bundle.outputs.sdk_artifact_name }}
          show-summary: true

      - name: Upload release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: microvm-release-${{ steps.identity.outputs.source_sha }}
          path: release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  publish:
    needs: build
    if: ${{ inputs.publish }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download exact built bundle
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: microvm-release-${{ needs.build.outputs.source_sha }}
          path: release

      - name: Verify downloaded release bundle
        env:
          ARTIFACT: ${{ needs.build.outputs.artifact_name }}
          SDK_ARTIFACT: ${{ needs.build.outputs.sdk_artifact_name }}
        working-directory: release
        run: |
          for artifact in "$ARTIFACT" "$SDK_ARTIFACT"; do
            for suffix in .sha256 .inventory.txt .provenance.json; do
              [[ -f "$artifact$suffix" ]] || {
                echo "downloaded release bundle is missing $artifact$suffix" >&2
                exit 1
              }
            done
            sha256sum --check --strict "$artifact.sha256"
          done
          [[ -f "$ARTIFACT.spdx.json" ]] || {
            echo "downloaded release bundle is missing $ARTIFACT.spdx.json" >&2
            exit 1
          }
          actual=$(find . -maxdepth 1 -type f | wc -l)
          [[ "$actual" -eq 9 ]] || {
            echo "downloaded release bundle must hold exactly the nine release files; found $actual" >&2
            exit 1
          }

      - name: Refuse existing publication
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "tag already exists; refusing to move or reuse $RELEASE_TAG" >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release or release assets already exist; refusing overwrite" >&2
            exit 1
          fi

      - name: Publish immutable non-production prerelease once
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
          VERSION: ${{ needs.build.outputs.version }}
          ARTIFACT: ${{ needs.build.outputs.artifact_name }}
          SDK_ARTIFACT: ${{ needs.build.outputs.sdk_artifact_name }}
        run: |
          cleanup() {
            gh release delete "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes >/dev/null 2>&1 || true
          }
          fail() {
            cleanup
            echo "$1" >&2
            exit 1
          }
          # Create the tag at the exact source commit, then the release as a
          # draft, so every verification below can still run before the
          # immutable seal. A draft release itself does not create a tag.
          gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$RELEASE_TAG" -f sha="$SOURCE_SHA" >/dev/null \
            || fail "could not create the release tag at $SOURCE_SHA"
          tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq .object.sha)
          [[ "$tag_sha" == "$SOURCE_SHA" ]] || fail "created tag does not point to the requested source commit"
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_SHA" \
            --draft \
            --prerelease \
            --latest=false \
            --title "microvm $VERSION non-production release" \
            --notes "Immutable non-production SDK package and host artifact for exact commit $SOURCE_SHA. No host, Cloudflare, production, or Free Vibecode change is performed by this workflow." \
            || fail "could not create the draft release"
          gh release upload "$RELEASE_TAG" release/* --repo "$GITHUB_REPOSITORY" \
            || fail "could not upload the release assets"
          expected_assets="$ARTIFACT $ARTIFACT.sha256 $ARTIFACT.inventory.txt $ARTIFACT.provenance.json $ARTIFACT.spdx.json $SDK_ARTIFACT $SDK_ARTIFACT.sha256 $SDK_ARTIFACT.inventory.txt $SDK_ARTIFACT.provenance.json"
          verify_assets() {
            actual_assets=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '[.assets[].name] | sort | join(" ")')
            expected_sorted=$(printf '%s\n' $expected_assets | sort | tr '\n' ' ' | sed 's/ $//')
            [[ "$actual_assets" == "$expected_sorted" ]] \
              || fail "release assets do not match the exact expected set"
            for artifact in "$ARTIFACT" "$SDK_ARTIFACT"; do
              remote_digest=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
                --json assets --jq '.assets[] | select(.name == "'"$artifact"'") | .digest')
              local_digest="sha256:$(cut -d' ' -f1 "release/$artifact.sha256")"
              [[ "$remote_digest" == "$local_digest" ]] \
                || fail "GitHub digest for $artifact does not match the built artifact"
            done
          }
          verify_assets
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false \
            || fail "could not publish the verified draft release"
          immutable=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json isImmutable --jq .isImmutable)
          [[ "$immutable" == true ]] \
            || fail "repository did not publish an immutable release; removed the incomplete release and tag"
          verify_assets
          tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq .object.sha)
          [[ "$tag_sha" == "$SOURCE_SHA" ]] \
            || fail "published tag no longer points to the requested source commit"
